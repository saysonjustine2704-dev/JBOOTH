<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBOOTH - Online Photobooth</title>

    <link rel="stylesheet" href="design.css">
</head>
<body>
    <header class="top-bar">
        <h1>JBOOTH</h1>
        <p>tamang selfie ka muna boy</p>
    </header>

    <main class="photobooth">
        <section class="intro">
            <p class="tag">ONLINE PHOTOBOOTH</p>
            <h2>Let's take some pictures! 📸</h2>
            <p>Capture four pictures and save!</p>
        </section>

        <section class="booth-card">
            <div class="camera-area">
                <video id="camera" autoplay playsinline muted></video>

                <div id="camera-message">
                    Your camera preview will appear here ♡
                </div>

                <div id="camera-countdown" aria-live="assertive"></div>
            </div>

            <p id="status">Ready for your photo session?</p>

            <div class="controls">
                <button id="start-camera" type="button">
                    Start Camera ♡
                </button>

                <button id="take-photo" type="button" disabled>
                    Take Photo 📸
                </button>
            </div>

            <p class="photo-count">
                Photos taken: <span id="photo-count">0</span> / 4
            </p>

            <section class="strip-preview">
                <h3>Your photo strip ♡</h3>

                <div id="photo-strip" class="photo-strip">
                    <div class="photo-slot" data-index="0">
                        <span class="placeholder">PHOTO 1</span>
                    </div>

                    <div class="photo-slot" data-index="1">
                        <span class="placeholder">PHOTO 2</span>
                    </div>

                    <div class="photo-slot" data-index="2">
                        <span class="placeholder">PHOTO 3</span>
                    </div>

                    <div class="photo-slot" data-index="3">
                        <span class="placeholder">PHOTO 4</span>
                    </div>

                    <p class="strip-caption"></p>
                </div>
            </section>

            <div class="customize">
                <label for="strip-color">Choose your strip color</label>

                <select id="strip-color">
                    <option value="#f6b8d0">Pink</option>
                    <option value="#d94b55">Red</option>
                    <option value="#a8d8f0">Blue</option>
                    <option value="#222222">Black</option>
                    <option value="#ffffff">White</option>
                </select>

                <label for="strip-text">Add text to your strip (optional)</label>

                <input id="strip-text" type="text" maxlength="30" placeholder="Type anything...">
            </div>

            <button id="download-photo" type="button" disabled>
                Download Photo Strip ♡
            </button>
        </section>
    </main>

    <footer>your online photobooth!</footer>

    <script src="script.js"></script>
</body>
</html>
